name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install -y ant
      - run: ant test
      - uses: actions/upload-artifact@v4
        with:
          name: mjc
          path: build/mjc.jar
